name: Verify Kansas Notary Journal
on:
  push:
    branches: [Prime]
    paths:
      - 'public/notary/**'
      - 'src/pages/api/notary/**'
      - 'migrations/**'
      - 'src/components/SiteHeader.astro'
      - 'src/pages/api/intake/**'
      - 'src/pages/api/intake.ts'
      - 'tests/**'
      - 'package*.json'
      - 'wrangler.jsonc'
      - '.github/workflows/notary-verify.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: node --check public/notary/app.js
      - run: node --test tests/*.test.mjs
      - run: npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/Prime' && github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Deploy Cloudflare Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: dcd87bec1efac6b2926f8e162268b446
